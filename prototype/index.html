<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Arachne</title>
</head>
<body>
    <div class="stage">
        <svg id="s" viewBox="0 0 400 400">
            <defs>

                <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
                    <feGaussianBlur id="gb" stdDeviation="6" result="b"/>
                    <feMerge>
                        <feMergeNode in="b"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <filter id="glow2" x="-50%" y="-20%" width="200%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="b"/>
                    <feMerge>
                        <feMergeNode in="b"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <radialGradient id="edge" cx="50%" cy="45%" r="55%">
                    <stop offset=".65" style="stop-color:#000;stop-opacity:0"/>
                    <stop offset="1" style="stop-color:#000;stop-opacity:.75"/>
                </radialGradient>

                <clipPath id="c9">
                    <circle r="9"/>
                </clipPath>
                <clipPath id="c16">
                    <circle r="16"/>
                </clipPath>
                <clipPath id="c28">
                    <circle r="28"/>
                </clipPath>
                
            </defs>

            <g id="root">
                <ellipse cx="200" cy="190" rx="165" ry="125" fill="#0e0f13" stroke="#1d3a44" stroke-width="2"/>
                
                <ellipse cx="200" cy="190" rx="165" ry="125" fill="url(#edge)"/>
                
                <g id="eyes" filter="url(#glow)"></g>
                
                <g id="fangs" filter="url(#glow2)">
                    <g class="fa"><rect x="-14" y="-4" width="28" height="38" rx="13" fill="#0b0c10" stroke="#1d3a44" stroke-width="2"/>
                        <path class="fang" d="M-6 28Q0 32 6 28Q4 52 0 66Q-4 52-6 28Z"/>
                    </g>
                    <g class="fa"><rect x="-14" y="-4" width="28" height="38" rx="13" fill="#0b0c10" stroke="#1d3a44" stroke-width="2"/>
                        <path class="fang" d="M-6 28Q0 32 6 28Q4 52 0 66Q-4 52-6 28Z"/>
                    </g>
                </g>

                <path id="tear" class="dr" opacity="0" d="M0 -9Q7 2 0 8Q-7 2 0 -9Z"/>
                
                <path id="sweat" class="dr" opacity="0" d="M0 -9Q7 2 0 8Q-7 2 0 -9Z"/>

                <text id="ex" class="exc" x="338" y="96" text-anchor="middle" opacity="0" transform="rotate(12 338 96)">!</text>
                
                <g id="z" opacity="0" transform="translate(322,110)">
                    <text class="z">z</text>
                    <text class="z" x="16" y="-16" style="animation-delay:.8s">Z</text>
                </g>

            </g>
        </svg>
    </div>

    <div class="btn-group" id="btns"></div>
    
    <script src="code.js"></script>
</body>
</html>

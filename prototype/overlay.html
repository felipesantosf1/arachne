<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
        svg { width: 100%; height: 100%; display: block; }   /* sem viewBox: 1 unidade = 1 pixel da tela */
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg">
        <line id="fio" stroke="#e5e7eb" stroke-width="1.5" stroke-linecap="round" opacity="0" />
    </svg>
    <script>
        const fio = document.getElementById('fio');
        window.arachne.aoDesenharFio((x1, y1, x2, y2) => {
            if (x1 === undefined) { fio.setAttribute('opacity', 0); return; }   // sem args: esconde
            fio.setAttribute('x1', x1); fio.setAttribute('y1', y1);
            fio.setAttribute('x2', x2); fio.setAttribute('y2', y2);
            fio.setAttribute('opacity', 0.85);
        });
    </script>
</body>
</html>
